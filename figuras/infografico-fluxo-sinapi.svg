<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de análise e previsão de custos com dados do SINAPI</title>
  <desc id="description">Infográfico vertical com seis etapas: base SINAPI, limpeza e preparação dos dados, modelos estatísticos espaço-temporais, machine learning e inteligência artificial, previsão de custos e análise regional, e apoio à tomada de decisão em políticas públicas.</desc>
  <defs>
    <style>
      .navy { fill: #12345A; }
      .blue { fill: #1D568A; }
      .orange { fill: #E8872B; }
      .white { fill: #FFFFFF; }
      .ink { fill: #18324B; }
      .muted { fill: #D8E5F0; }
      .card { fill: #FFFFFF; stroke: #D8E2EC; stroke-width: 2; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 400; }
      .icon { fill: none; stroke: #FFFFFF; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-dark { fill: none; stroke: #12345A; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#12345A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="#FFFFFF"/>

  <!-- Base de dados -->
  <g filter="url(#shadow)">
    <rect x="130" y="58" width="940" height="186" rx="24" class="navy"/>
  </g>
  <g class="icon" aria-hidden="true">
    <ellipse cx="244" cy="127" rx="47" ry="17"/>
    <path d="M197 127v63c0 10 21 18 47 18s47-8 47-18v-63"/>
    <path d="M197 158c0 10 21 18 47 18s47-8 47-18"/>
    <path d="M197 189c0 10 21 18 47 18s47-8 47-18"/>
  </g>
  <text x="345" y="137" class="white" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">SINAPI</text>
  <text x="347" y="190" class="muted" font-family="Arial, Helvetica, sans-serif" font-size="30">(Base Nacional de Dados)</text>

  <!-- Conector 1 -->
  <path d="M600 250v47" stroke="#E8872B" stroke-width="8" stroke-linecap="round"/>
  <path d="m584 284 16 19 16-19" fill="none" stroke="#E8872B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Preparação -->
  <g filter="url(#shadow)">
    <rect x="130" y="315" width="940" height="190" rx="22" class="blue"/>
  </g>
  <g class="icon" aria-hidden="true">
    <circle cx="244" cy="410" r="31"/>
    <circle cx="244" cy="410" r="10"/>
    <path d="m244 361 8 12 14-2 5 13 14 6-2 14 9 11-9 11 2 14-14 6-5 13-14-2-8 12-12-8-12 8-8-12-14 2-5-13-14-6 2-14-9-11 9-11-2-14 14-6 5-13 14 2 8-12z"/>
  </g>
  <text x="345" y="423" class="white label">Limpeza e Preparação dos Dados</text>

  <!-- Conector 2 -->
  <path d="M600 511v42" stroke="#E8872B" stroke-width="8" stroke-linecap="round"/>
  <path d="m584 540 16 19 16-19" fill="none" stroke="#E8872B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Modelos estatísticos -->
  <g filter="url(#shadow)">
    <rect x="130" y="571" width="940" height="190" rx="22" class="blue"/>
  </g>
  <g class="icon" aria-hidden="true">
    <path d="M196 704v-70h96"/>
    <path d="m204 687 25-24 20 13 36-39"/>
    <circle cx="204" cy="687" r="4" fill="#FFFFFF"/>
    <circle cx="229" cy="663" r="4" fill="#FFFFFF"/>
    <circle cx="249" cy="676" r="4" fill="#FFFFFF"/>
    <circle cx="285" cy="637" r="4" fill="#FFFFFF"/>
    <path d="M197 619h96M197 619v87"/>
  </g>
  <text x="345" y="651" class="white label">Modelos Estatísticos</text>
  <text x="345" y="701" class="white label">Espaço-Temporais</text>

  <!-- Conector 3 -->
  <path d="M600 767v42" stroke="#E8872B" stroke-width="8" stroke-linecap="round"/>
  <path d="m584 796 16 19 16-19" fill="none" stroke="#E8872B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Machine learning e IA -->
  <g filter="url(#shadow)">
    <rect x="130" y="827" width="940" height="190" rx="22" class="blue"/>
  </g>
  <g class="icon" aria-hidden="true">
    <circle cx="207" cy="875" r="10"/>
    <circle cx="280" cy="875" r="10"/>
    <circle cx="244" cy="918" r="10"/>
    <circle cx="207" cy="963" r="10"/>
    <circle cx="280" cy="963" r="10"/>
    <circle cx="244" cy="1000" r="10"/>
    <path d="m215 881 21 30m36-30-21 30m-36 28 21-15m36 15-21-15m-23 27v24m31-24v24"/>
    <path d="M190 897h-10m119 0h-10M190 942h-10m119 0h-10"/>
  </g>
  <text x="345" y="904" class="white label">Machine Learning e IA</text>
  <text x="345" y="955" class="white small">(XGBoost, BiLSTM, Deep Learning)</text>

  <!-- Conector 4 -->
  <path d="M600 1023v42" stroke="#E8872B" stroke-width="8" stroke-linecap="round"/>
  <path d="m584 1052 16 19 16-19" fill="none" stroke="#E8872B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Previsão -->
  <g filter="url(#shadow)">
    <rect x="130" y="1083" width="940" height="190" rx="22" class="blue"/>
  </g>
  <g class="icon" aria-hidden="true">
    <path d="M190 1220v-91h110"/>
    <path d="m202 1203 30-28 22 9 39-48"/>
    <path d="M274 1136h19v19"/>
    <path d="M202 1180h91M202 1155h91"/>
  </g>
  <text x="345" y="1164" class="white label">Previsão de Custos</text>
  <text x="345" y="1214" class="white label">e Análise Regional</text>

  <!-- Conector 5 -->
  <path d="M600 1279v42" stroke="#E8872B" stroke-width="8" stroke-linecap="round"/>
  <path d="m584 1308 16 19 16-19" fill="none" stroke="#E8872B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decisão pública -->
  <g filter="url(#shadow)">
    <rect x="130" y="1339" width="940" height="220" rx="22" class="navy"/>
  </g>
  <g class="icon" aria-hidden="true">
    <path d="m195 1410 49-27 49 27"/>
    <path d="M203 1417h82M209 1417v74m23-74v74m24-74v74m23-74v74m-79 0h87"/>
  </g>
  <text x="345" y="1431" class="white label">Apoio à Tomada de Decisão</text>
  <text x="345" y="1485" class="white label">em Políticas Públicas</text>

  <path d="M220 1630h760" stroke="#D8E2EC" stroke-width="2"/>
  <text x="600" y="1682" text-anchor="middle" class="ink" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">DADOS  →  MODELAGEM  →  PREVISÃO  →  DECISÃO</text>
</svg>
